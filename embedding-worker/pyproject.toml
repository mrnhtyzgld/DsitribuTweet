[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "distributweet-embedding-worker"
version = "0.1.0"
description = "Embedding HTTP service and Kafka-to-Qdrant worker for DistribuTweet"
requires-python = ">=3.11"
dependencies = [
  "confluent-kafka>=2.4.0",
  "fastapi>=0.111.0",
  "pydantic>=2.7.0",
  "qdrant-client>=1.10.0",
  "tenacity>=8.3.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
model = [
  "torch==2.5.1+cpu",
  "sentence-transformers==3.3.1",
]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]
