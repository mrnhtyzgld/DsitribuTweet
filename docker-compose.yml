name: distributweet

services:
  # ---------------------------------------------------------------
  # Kafka (KRaft modu - Zookeeper gerektirmez)
  # ---------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      # Tek broker oldugu icin replication factor 1 olmak zorunda
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      # Partition paralelligini gostermek icin varsayilan 3
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # Topic'leri acikca olusturur. auto-create'e guvenmiyoruz cunku
  # partition sayisinin 3 oldugunu garanti etmemiz gerekiyor.
  kafka-init:
    image: apache/kafka:3.8.0
    container_name: kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    # Blok literal (|) kullaniyoruz: '>' katlama operatoru satir sonlarini
    # bosluga cevirip argumanlari ayri komut haline getiriyordu.
    command:
      - bash
      - -c
      - |
        set -e
        K=/opt/kafka/bin/kafka-topics.sh
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic posts.raw --partitions 3 --replication-factor 1
        $$K --bootstrap-server kafka:9092 --create --if-not-exists --topic posts.cleaned --partitions 3 --replication-factor 1
        echo '--- olusturulan topicler ---'
        $$K --bootstrap-server kafka:9092 --describe

  # ---------------------------------------------------------------
  # Qdrant vektor veritabani
  # ---------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Qdrant imajinda curl/wget yok; TCP baglantisini bash ile kontrol ediyoruz
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------
  # Spark standalone cluster: 1 master + 2 worker
  # (pseudo-distributed: rapor §6'daki "birden fazla executor" iddiasi)
  # ---------------------------------------------------------------
  spark-master:
    image: apache/spark:3.5.4
    container_name: spark-master
    user: root
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # Java 17: Spark JDK ic modullerine erisim icin acik izin ister
      SPARK_DAEMON_JAVA_OPTS: >-
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
      --host spark-master --port 7077 --webui-port 8080
    ports:
      - "8080:8080"   # Spark master UI
      - "7077:7077"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker-1:
    image: apache/spark:3.5.4
    container_name: spark-worker-1
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # Java 17: Spark JDK ic modullerine erisim icin acik izin ister
      SPARK_DAEMON_JAVA_OPTS: >-
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 1G --webui-port 8081

  spark-worker-2:
    image: apache/spark:3.5.4
    container_name: spark-worker-2
    user: root
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_NO_DAEMONIZE: "true"
      # Java 17: Spark JDK ic modullerine erisim icin acik izin ister
      SPARK_DAEMON_JAVA_OPTS: >-
        --add-opens=java.base/java.lang=ALL-UNNAMED
        --add-opens=java.base/java.io=ALL-UNNAMED
        --add-opens=java.base/java.net=ALL-UNNAMED
        --add-opens=java.base/java.nio=ALL-UNNAMED
        --add-opens=java.base/java.util=ALL-UNNAMED
        --add-opens=java.base/sun.nio.ch=ALL-UNNAMED
    command: >
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker
      spark://spark-master:7077 --cores 2 --memory 1G --webui-port 8081

  # Spark streaming isini cluster'a submit eden container
  spark-cleaner:
    build:
      context: ./scala
      dockerfile: Dockerfile.cleaner
    container_name: spark-cleaner
    # Checkpoint volume'una yazabilmesi icin root
    user: root
    depends_on:
      kafka:
        condition: service_healthy
      spark-master:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      SPARK_MASTER_URL: spark://spark-master:7077
      KAFKA_BOOTSTRAP: kafka:9092
      SOURCE_TOPIC: posts.raw
      SINK_TOPIC: posts.cleaned
      CHECKPOINT_DIR: /checkpoints
      VOCAB_PATH: /app/vocab.txt
    volumes:
      - spark-checkpoints:/checkpoints
    ports:
      - "4040:4040"   # Spark application UI

  # ---------------------------------------------------------------
  # Veri ureteci -> posts.raw
  # ---------------------------------------------------------------
  data-generator:
    build: ./data-generator
    container_name: data-generator
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: posts.raw
      INPUT_CSV: ${INPUT_CSV:-https://raw.githubusercontent.com/luminati-io/Twitter-X-dataset-samples/main/twitter-posts.csv}
      INPUT_OFFSET: ${INPUT_OFFSET:-0}
      RATE_PER_SEC: ${RATE_PER_SEC:-50}
      TOTAL_MESSAGES: ${TOTAL_MESSAGES:-1000}
      SEED: ${SEED:-42}
    restart: "no"

  # ---------------------------------------------------------------
  # Embedding worker'lari: ayni consumer group, 2 replica
  # (pseudo-distributed: rapor §6'daki "birden fazla worker" iddiasi)
  # ---------------------------------------------------------------
  embedding-worker:
    build: ./embedding-worker
    depends_on:
      kafka:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPIC: posts.cleaned
      GROUP_ID: embedding-workers
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      COLLECTION: posts
      BATCH_SIZE: "32"
      EMBED_PORT: "8000"
    deploy:
      replicas: 2
    restart: unless-stopped

  # Sabit isimli tekil embedding servisi: rec-api'nin /embed cagrilari icin.
  # Ayni imaj, ama consumer dongusu kapali (sadece HTTP servisi).
  embedding-api:
    build: ./embedding-worker
    container_name: embedding-api
    depends_on:
      qdrant:
        condition: service_healthy
    environment:
      RUN_CONSUMER: "false"
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      COLLECTION: posts
      EMBED_PORT: "8000"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      # Model ilk yuklemede CPU'da 30-60sn surebiliyor
      start_period: 120s

  # ---------------------------------------------------------------
  # Scala Recommendation API
  # ---------------------------------------------------------------
  rec-api:
    build:
      context: ./scala
      dockerfile: Dockerfile.api
    container_name: rec-api
    depends_on:
      qdrant:
        condition: service_healthy
      embedding-api:
        condition: service_healthy
    environment:
      QDRANT_URL: http://qdrant:6333
      EMBED_URL: http://embedding-api:8000
      COLLECTION: posts
      HTTP_PORT: "8081"
      SEMANTIC_WEIGHT: "0.85"
      RECENCY_WEIGHT: "0.15"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  kafka-data:
  qdrant-data:
  spark-checkpoints:
